name: workout_ai
description: AI-powered workout form analysis application using a CNN-LSTM model.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Charts / Visualizations
  fl_chart: ^0.68.0

  # HTTP client (for future FastAPI backend integration)
  http: ^1.2.1
  dio: ^5.4.3+1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
